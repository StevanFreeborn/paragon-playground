server {
    listen 443 ssl;
    server_name ~^(?<org_slug>[a-z0-9-]+)\.paragonplayground\.localhost$;

    ssl_certificate     /etc/nginx/certs/_wildcard.paragonplayground.localhost.pem;
    ssl_certificate_key /etc/nginx/certs/_wildcard.paragonplayground.localhost-key.pem;

    location /api/ {
        client_max_body_size 0;
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Organization-Slug $org_slug;
    }

    location / {
        proxy_pass http://frontend:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 80;
    server_name ~^(?<org_slug>[a-z0-9-]+)\.paragonplayground\.localhost$;
    return 301 https://$host$request_uri;
}

server {
    listen 80;
    server_name paragonplayground.localhost;

    location / {
        return 400 "Missing organization subdomain. Use https://<org-slug>.paragonplayground.localhost";
    }
}
